<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini-web2api 管理面板</title>
<style>
:root {
  --bg: #0f1117; --bg2: #161b22; --bg3: #1c2333;
  --border: #30363d; --text: #e6edf3; --text2: #8b949e;
  --accent: #58a6ff; --green: #3fb950; --red: #f85149;
  --orange: #d29922; --purple: #bc8cff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }

/* Layout */
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 12px 0; }
header .inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex;
  align-items: center; justify-content: space-between; }
header h1 { font-size: 18px; font-weight: 600; }
header h1 span { color: var(--accent); }
header .badge { font-size: 12px; background: var(--green); color: #000; padding: 2px 8px;
  border-radius: 12px; font-weight: 600; }
header .badge.offline { background: var(--red); color: #fff; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin: 20px 0 16px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
.tab { padding: 8px 16px; cursor: pointer; color: var(--text2); border-bottom: 2px solid transparent;
  font-size: 14px; transition: all 0.15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Cards */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; margin-bottom: 16px; }
.card h3 { font-size: 14px; color: var(--text2); margin-bottom: 12px; text-transform: uppercase;
  letter-spacing: 0.5px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.stat { padding: 12px; background: var(--bg3); border-radius: 6px; }
.stat .label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.stat .value { font-size: 20px; font-weight: 600; }
.stat .value.green { color: var(--green); }
.stat .value.red { color: var(--red); }
.stat .value.orange { color: var(--orange); }
.stat .value.accent { color: var(--accent); }

/* Table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 12px; color: var(--text2); font-weight: 500;
  border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
tr:hover { background: var(--bg3); }
.tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px;
  font-weight: 500; }
.tag.green { background: rgba(63,185,80,0.15); color: var(--green); }
.tag.red { background: rgba(248,81,73,0.15); color: var(--red); }
.tag.orange { background: rgba(210,153,34,0.15); color: var(--orange); }
.tag.gray { background: rgba(139,148,158,0.15); color: var(--text2); }

/* Form */
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
input, textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px;
  font-family: inherit; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 80px; }
button { cursor: pointer; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg3); color: var(--text); font-size: 13px; transition: all 0.15s; }
button:hover { background: var(--border); }
button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
button.primary:hover { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; }

/* Logs */
.log-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px; max-height: 500px; overflow-y: auto; font-family: 'Cascadia Code', 'Fira Code',
  monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
.log-error { color: var(--red); }
.log-warn { color: var(--orange); }
.log-info { color: var(--text); }
.log-debug { color: var(--text2); }

/* Test result */
.result-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px; margin-top: 12px; font-family: 'Cascadia Code', 'Fira Code', monospace;
  font-size: 12px; white-space: pre-wrap; max-height: 400px; overflow-y: auto; display: none; }
.result-box.show { display: block; }

/* Config table */
.config-table { width: 100%; }
.config-table td { padding: 6px 12px; }
.config-table td:first-child { color: var(--text2); white-space: nowrap; width: 200px; }
.config-table td:last-child { font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; }

/* Responsive */
@media (max-width: 768px) {
  .stat-grid { grid-template-columns: 1fr 1fr; }
  header .inner { flex-direction: column; gap: 8px; }
}
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1><span>Gemini</span>-web2api</h1>
    <div>
      <span id="statusBadge" class="badge offline">OFFLINE</span>
      <span style="margin-left:12px;font-size:13px;color:var(--text2)" id="uptimeText"></span>
    </div>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="dashboard">仪表盘</div>
    <div class="tab" data-tab="accounts">账号管理</div>
    <div class="tab" data-tab="test">在线测试</div>
    <div class="tab" data-tab="logs">日志</div>
    <div class="tab" data-tab="config">配置</div>
  </div>

  <!-- Dashboard -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="card">
      <h3>系统状态</h3>
      <div class="stat-grid">
        <div class="stat">
          <div class="label">运行时间</div>
          <div class="value accent" id="sUptime">-</div>
        </div>
        <div class="stat">
          <div class="label">浏览器</div>
          <div class="value" id="sBrowser">-</div>
        </div>
        <div class="stat">
          <div class="label">当前账号</div>
          <div class="value" id="sCurrentAuth">-</div>
        </div>
        <div class="stat">
          <div class="label">可用账号</div>
          <div class="value green" id="sRotation">-</div>
        </div>
        <div class="stat">
          <div class="label">总扫描</div>
          <div class="value" id="sTotal">-</div>
        </div>
        <div class="stat">
          <div class="label">已过期</div>
          <div class="value red" id="sExpired">-</div>
        </div>
        <div class="stat">
          <div class="label">运行时失败</div>
          <div class="value red" id="sRuntimeFailed">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>快速操作</h3>
      <div class="btn-row">
        <button class="primary" onclick="reloadAuth()">重新加载 Auth</button>
        <button onclick="refreshStatus()">刷新状态</button>
      </div>
      <div id="reloadResult" class="result-box"></div>
    </div>
  </div>

  <!-- Accounts -->
  <div id="tab-accounts" class="tab-content">
    <div class="card">
      <h3>账号列表</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>账号名</th><th>状态</th><th>轮换</th><th>Canonical</th><th>操作</th></tr>
          </thead>
          <tbody id="accountTable"></tbody>
        </table>
      </div>
      <div id="noAccounts" style="display:none;padding:20px;text-align:center;color:var(--text2)">
        暂无 auth 文件。请将 AIStudioToAPI 生成的 auth-N.json 放入 auth/ 目录。
      </div>
    </div>
  </div>

  <!-- Test -->
  <div id="tab-test" class="tab-content">
    <div class="card">
      <h3>测试 generateContent</h3>
      <div class="form-group">
        <label>模型</label>
        <select id="testModel"></select>
      </div>
      <div class="form-group">
        <label>Prompt</label>
        <textarea id="testPrompt" placeholder="输入测试 prompt...">用一句话介绍一下自己。</textarea>
      </div>
      <div class="form-group">
        <label>System Instruction（可选）</label>
        <input id="testSystem" placeholder="系统指令..." />
      </div>
      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1">
          <label>思考等级</label>
          <select id="testThinkingLevel">
            <option value="standard">标准</option>
            <option value="extended">扩展</option>
          </select>
        </div>
        <div class="form-group" style="flex:1">
          <label>Temperature</label>
          <input id="testTemp" type="number" step="0.1" min="0" max="2" value="0.7" />
        </div>
        <div class="form-group" style="flex:1">
          <label>Max Output Tokens</label>
          <input id="testMaxTokens" type="number" min="1" max="65536" value="2048" />
        </div>
      </div>
      <div class="btn-row">
        <button class="primary" id="testBtn" onclick="runTest()">发送测试</button>
      </div>
      <div id="testResult" class="result-box"></div>
    </div>
  </div>

  <!-- Logs -->
  <div id="tab-logs" class="tab-content">
    <div class="card">
      <h3>实时日志</h3>
      <div class="btn-row" style="margin-bottom:12px;margin-top:0">
        <button onclick="refreshLogs()">刷新</button>
        <button onclick="clearLogDisplay()">清空显示</button>
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text2);margin-left:auto">
          <input type="checkbox" id="autoScroll" checked> 自动滚动
        </label>
      </div>
      <div class="log-box" id="logBox">等待加载...</div>
    </div>
  </div>

  <!-- Config -->
  <div id="tab-config" class="tab-content">
    <div class="card">
      <h3>运行配置</h3>
      <table class="config-table" id="configTable"></table>
    </div>
  </div>
</div>

<script>
const API_BASE = '';

// --- Tab switching ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'logs') refreshLogs();
  });
});

// --- Helpers ---
function formatUptime(s) {
  if (s < 60) return Math.floor(s) + 's';
  if (s < 3600) return Math.floor(s/60) + 'm ' + Math.floor(s%60) + 's';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h + 'h ' + m + 'm';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// --- Status polling ---
let statusData = null;

async function refreshStatus() {
  try {
    const r = await fetch(API_BASE + '/api/status');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    statusData = await r.json();
    renderDashboard(statusData);
    renderAccounts(statusData);
    renderConfig(statusData);
    renderModelSelect(statusData);
    document.getElementById('statusBadge').textContent = 'ONLINE';
    document.getElementById('statusBadge').className = 'badge';
  } catch (e) {
    document.getElementById('statusBadge').textContent = 'OFFLINE';
    document.getElementById('statusBadge').className = 'badge offline';
    document.getElementById('uptimeText').textContent = '';
  }
}

function renderDashboard(d) {
  document.getElementById('sUptime').textContent = formatUptime(d.uptime);
  document.getElementById('uptimeText').textContent = '运行 ' + formatUptime(d.uptime);

  const browserOk = d.browser.started;
  const el = document.getElementById('sBrowser');
  el.textContent = browserOk ? '运行中' : '未启动';
  el.className = 'value ' + (browserOk ? 'green' : 'red');

  document.getElementById('sCurrentAuth').textContent =
    d.browser.currentAuthIndex !== null ? '#' + d.browser.currentAuthIndex : '-';
  document.getElementById('sRotation').textContent = d.accounts.rotation;
  document.getElementById('sTotal').textContent = d.accounts.total;
  document.getElementById('sExpired').textContent = d.accounts.expired;
  document.getElementById('sRuntimeFailed').textContent = d.accounts.runtimeFailed || 0;
}

function renderAccounts(d) {
  const tbody = document.getElementById('accountTable');
  const noAcc = document.getElementById('noAccounts');
  if (!d.accounts.details.length) {
    tbody.innerHTML = '';
    noAcc.style.display = 'block';
    return;
  }
  noAcc.style.display = 'none';
  tbody.innerHTML = d.accounts.details.map(a => {
    let statusTag = '';
    if (a.runtimeFailed) {
      const reason = a.runtimeFailureReason ? ' title="' + escapeHtml(a.runtimeFailureReason) + '"' : '';
      statusTag = '<span class="tag red"' + reason + '>登录失败</span>';
    } else if (a.isExpired) statusTag = '<span class="tag red">已过期</span>';
    else if (a.isDuplicate) statusTag = '<span class="tag orange">重复</span>';
    else if (a.isHealthy) statusTag = '<span class="tag green">正常</span>';
    else statusTag = '<span class="tag gray">不可用</span>';

    const rotationTag = a.isRotation && !a.runtimeFailed ? '<span class="tag green">是</span>' : '<span class="tag gray">否</span>';
    const isCurrent = d.browser.currentAuthIndex === a.index;
    const name = a.name || '<span style="color:var(--text2)">-</span>';

    const actionCell = isCurrent
      ? '<span class="tag green">当前</span>'
      : a.isRotation
        ? `<button class="primary" style="padding:3px 10px;font-size:12px" onclick="switchAccount(${a.index})">切换</button>`
        : '';

    return `<tr${isCurrent ? ' style="background:var(--bg3)"' : ''}>
      <td>${isCurrent ? '<strong>#' + a.index + ' *</strong>' : a.index}</td>
      <td>${name}</td>
      <td>${statusTag}</td>
      <td>${rotationTag}</td>
      <td>${a.canonicalIndex !== null ? a.canonicalIndex : '-'}</td>
      <td>${actionCell}</td>
    </tr>`;
  }).join('');
}

function renderConfig(d) {
  const table = document.getElementById('configTable');
  const cfg = d.config;
  table.innerHTML = `
    <tr><td>Gemini Web URL</td><td>${escapeHtml(cfg.geminiWebUrl)}</td></tr>
    <tr><td>默认模型</td><td>${escapeHtml(cfg.defaultModel)}</td></tr>
    <tr><td>可用模型</td><td>${escapeHtml(cfg.models.map(m => m.id + (m.webModelLabel ? ' → ' + m.webModelLabel : '')).join(', '))}</td></tr>
    <tr><td>浏览器模式</td><td>${cfg.browserHeadless ? '无头 (headless)' : '有头 (headed)'}</td></tr>
    <tr><td>最大上下文数</td><td>${cfg.maxContexts}</td></tr>
    <tr><td>最大重试次数</td><td>${cfg.maxRetries}</td></tr>
    <tr><td>重试间隔</td><td>${cfg.retryDelayMs} ms</td></tr>
    <tr><td>请求超时</td><td>${cfg.requestTimeoutMs} ms</td></tr>
    <tr><td>Auth 写回</td><td>${cfg.enableAuthUpdate ? '启用' : '禁用'}</td></tr>
    <tr><td>临时对话模式</td><td>${cfg.tempConversationMode ? '启用（每次请求新建对话）' : '禁用（复用对话）'}</td></tr>
  `;
}

function renderModelSelect(d) {
  const select = document.getElementById('testModel');
  if (!select || !d.config.models) return;

  const current = select.value || d.config.defaultModel;
  select.innerHTML = d.config.models.map(m =>
    `<option value="${escapeHtml(m.id)}">${escapeHtml(m.displayName || m.id)}</option>`
  ).join('');
  select.value = d.config.models.some(m => m.id === current) ? current : d.config.defaultModel;
}

// --- Account switch ---
async function switchAccount(authIndex) {
  if (!confirm('确认切换到账号 #' + authIndex + '？')) return;
  try {
    const r = await fetch(API_BASE + '/api/account/switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ authIndex }),
    });
    const d = await r.json();
    if (d.ok) {
      await refreshStatus();
    } else {
      alert('切换失败: ' + (d.error?.message || '未知错误'));
    }
  } catch (e) {
    alert('切换失败: ' + e.message);
  }
}

// --- Auth reload ---
async function reloadAuth() {
  const box = document.getElementById('reloadResult');
  box.className = 'result-box show';
  box.textContent = '正在重新加载...';
  try {
    const r = await fetch(API_BASE + '/api/auth/reload', { method: 'POST' });
    const d = await r.json();
    box.textContent = JSON.stringify(d, null, 2);
    await refreshStatus();
  } catch (e) {
    box.textContent = '错误: ' + e.message;
  }
}

// --- Test ---
async function runTest() {
  const btn = document.getElementById('testBtn');
  const box = document.getElementById('testResult');
  btn.disabled = true;
  btn.textContent = '发送中...';
  box.className = 'result-box show';
  box.textContent = '等待响应...';

  const body = {
    model: document.getElementById('testModel').value || (statusData?.config?.defaultModel || 'gemini-3.1-flash-lite'),
    prompt: document.getElementById('testPrompt').value,
    generationConfig: {
      temperature: parseFloat(document.getElementById('testTemp').value) || 0.7,
      maxOutputTokens: parseInt(document.getElementById('testMaxTokens').value) || 2048,
      thinkingLevel: document.getElementById('testThinkingLevel').value || 'standard',
    },
  };
  const sys = document.getElementById('testSystem').value.trim();
  if (sys) body.systemInstruction = { parts: [{ text: sys }] };

  try {
    const t0 = Date.now();
    const r = await fetch(API_BASE + '/api/test/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    box.textContent = `// 状态: ${r.status} | 耗时: ${elapsed}s\n\n` + JSON.stringify(d, null, 2);
  } catch (e) {
    box.textContent = '请求失败: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '发送测试';
  }
}

// --- Logs ---
function refreshLogs() {
  if (!statusData || !statusData.logs) return;
  const box = document.getElementById('logBox');
  box.innerHTML = statusData.logs.map(e => {
    const cls = 'log-' + e.level;
    return `<span class="${cls}">[${e.ts}] [${e.level.toUpperCase()}] ${escapeHtml(e.message)}</span>`;
  }).join('\n');
  if (document.getElementById('autoScroll').checked) {
    box.scrollTop = box.scrollHeight;
  }
}

function clearLogDisplay() {
  document.getElementById('logBox').textContent = '已清空显示（刷新可恢复）';
}

// --- Init ---
refreshStatus();
setInterval(refreshStatus, 5000);

// Keyboard shortcut: Enter in test prompt runs test
document.getElementById('testPrompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    runTest();
  }
});
</script>
</body>
</html>
