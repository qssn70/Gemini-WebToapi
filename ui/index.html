<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini-web2api 管理面板</title>
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>

<header>
  <div class="inner">
    <h1><span>Gemini</span>-web2api</h1>
    <div>
      <span id="statusBadge" class="badge offline">OFFLINE</span>
      <span style="margin-left:12px;font-size:13px;color:var(--text2)" id="uptimeText"></span>
    </div>
  </div>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="dashboard">仪表盘</div>
    <div class="tab" data-tab="accounts">账号管理</div>
    <div class="tab" data-tab="test">在线测试</div>
    <div class="tab" data-tab="logs">日志</div>
    <div class="tab" data-tab="config">配置</div>
  </div>

  <div id="tab-dashboard" class="tab-content active">
    <div class="card">
      <h3>系统状态</h3>
      <div class="stat-grid">
        <div class="stat">
          <div class="label">运行时间</div>
          <div class="value accent" id="sUptime">-</div>
        </div>
        <div class="stat">
          <div class="label">浏览器</div>
          <div class="value" id="sBrowser">-</div>
        </div>
        <div class="stat">
          <div class="label">当前账号</div>
          <div class="value" id="sCurrentAuth">-</div>
        </div>
        <div class="stat">
          <div class="label">可用账号</div>
          <div class="value green" id="sRotation">-</div>
        </div>
        <div class="stat">
          <div class="label">总扫描</div>
          <div class="value" id="sTotal">-</div>
        </div>
        <div class="stat">
          <div class="label">已过期</div>
          <div class="value red" id="sExpired">-</div>
        </div>
        <div class="stat">
          <div class="label">运行时失败</div>
          <div class="value red" id="sRuntimeFailed">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>快速操作</h3>
      <div class="btn-row">
        <button class="primary" onclick="reloadAuth()">重新加载 Auth</button>
        <button onclick="refreshStatus()">刷新状态</button>
      </div>
      <div id="reloadResult" class="result-box"></div>
    </div>
  </div>

  <div id="tab-accounts" class="tab-content">
    <div class="card">
      <h3>账号列表</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>账号名</th><th>状态</th><th>轮换</th><th>Canonical</th><th>操作</th></tr>
          </thead>
          <tbody id="accountTable"></tbody>
        </table>
      </div>
      <div id="noAccounts" style="display:none;padding:20px;text-align:center;color:var(--text2)">
        暂无 auth 文件。请将 AIStudioToAPI 生成的 auth-N.json 放入 auth/ 目录。
      </div>
    </div>
  </div>

  <div id="tab-test" class="tab-content">
    <div class="card">
      <h3>测试 generateContent</h3>
      <div class="form-group">
        <label>模型</label>
        <select id="testModel"></select>
      </div>
      <div class="form-group">
        <label>Prompt</label>
        <textarea id="testPrompt" placeholder="输入测试 prompt...">用一句话介绍一下自己。</textarea>
      </div>
      <div class="form-group">
        <label>System Instruction（可选）</label>
        <input id="testSystem" placeholder="系统指令..." />
      </div>
      <div style="display:flex;gap:12px">
        <div class="form-group" style="flex:1">
          <label>思考等级</label>
          <select id="testThinkingLevel">
            <option value="standard">标准</option>
            <option value="extended">扩展</option>
          </select>
        </div>
        <div class="form-group" style="flex:1">
          <label>Temperature</label>
          <input id="testTemp" type="number" step="0.1" min="0" max="2" value="0.7" />
        </div>
        <div class="form-group" style="flex:1">
          <label>Max Output Tokens</label>
          <input id="testMaxTokens" type="number" min="1" max="65536" value="2048" />
        </div>
      </div>
      <div class="btn-row">
        <button class="primary" id="testBtn" onclick="runTest()">发送测试</button>
      </div>
      <div id="testResult" class="result-box"></div>
    </div>
  </div>

  <div id="tab-logs" class="tab-content">
    <div class="card">
      <h3>实时日志</h3>
      <div class="btn-row" style="margin-bottom:12px;margin-top:0">
        <button onclick="refreshLogs()">刷新</button>
        <button onclick="clearLogDisplay()">清空显示</button>
        <label style="display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text2);margin-left:auto">
          <input type="checkbox" id="autoScroll" checked> 自动滚动
        </label>
      </div>
      <div class="log-box" id="logBox">等待加载...</div>
    </div>
  </div>

  <div id="tab-config" class="tab-content">
    <div class="card">
      <h3>运行配置</h3>
      <table class="config-table" id="configTable"></table>
    </div>
  </div>
</div>

<script src="/ui/app.js"></script>
</body>
</html>
